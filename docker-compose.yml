version: '3.8'

services:
  backend:
    image: vinitgupta/bhindi-backend:latest    # <--- Pulls from Docker Hub
    container_name: bhindi_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      # Add your MongoDB URI and Cloudinary keys here
      - MONGODB_URI=your_mongo_uri
      - JWT_SECRET=your_jwt_secret
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
    restart: unless-stopped

  frontend:
    image: vinitgupta/bhindi-frontend:latest   # <--- Pulls from Docker Hub
    container_name: bhindi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped